# Full stack: API (REST/GraphQL/gRPC/WebSockets) ×2 behind nginx, federation gateway, test frontend,
# PostgreSQL, Redis, Elasticsearch, RabbitMQ, EventStoreDB, Prometheus, Grafana.
x-api-env: &api-env
  NODE_ENV: production
  PORT: 4000
  DATABASE_URL: postgresql://enterprise:enterprise@postgres:5432/enterprise
  REDIS_URL: redis://redis:6379
  JWT_SECRET: ${JWT_SECRET:-change-me-dev-jwt-secret-0123}
  ELASTICSEARCH_NODE: http://elasticsearch:9200
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
  EVENTSTORE_CONNECTION_STRING: esdb://eventstore:2113?tls=false
  WEBHOOK_SECRET: ${WEBHOOK_SECRET:-change-me-webhook}
  GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
  CORS_ORIGIN: http://localhost:3103,http://localhost

services:
  app:
    build: .
    environment: *api-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      elasticsearch: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      eventstore: { condition: service_started }
    ports: ["50051:50051"]
    deploy:
      replicas: 2
      resources:
        limits: { cpus: '1', memory: 512M }
    restart: unless-stopped

  gateway:
    build: .
    command: ["node", "dist/gateway/main"]
    environment:
      GRAPHQL_SUBGRAPHS: enterprise=http://app:4000/graphql
      GATEWAY_PORT: 4001
    ports: ["4001:4001"]
    depends_on: [app]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend-test
      args: { NEXT_PUBLIC_API_URL: "http://localhost" }
    ports: ["3103:3103"]
    depends_on: [nginx]

  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes: [./nginx.conf:/etc/nginx/nginx.conf:ro]
    depends_on: [app]
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: enterprise, POSTGRES_PASSWORD: enterprise, POSTGRES_DB: enterprise }
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enterprise"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes: [es_data:/usr/share/elasticsearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.0-management-alpine
    ports: ["15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  eventstore:
    image: eventstore/eventstore:24.10
    environment:
      EVENTSTORE_INSECURE: "true"
      EVENTSTORE_RUN_PROJECTIONS: All
      EVENTSTORE_MEM_DB: "false"
    ports: ["2113:2113"]
    volumes: [eventstore_data:/var/lib/eventstore]

  prometheus:
    image: prom/prometheus:v3.0.1
    ports: ["9090:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:11.4.0
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes: [grafana_data:/var/lib/grafana]

volumes:
  postgres_data:
  redis_data:
  es_data:
  eventstore_data:
  prometheus_data:
  grafana_data:
