// Protocol Buffers definition for nestjs-enterprise-api

syntax = "proto3";

package enterprise;

service EnterpriseService {
  rpc CreateEntity(Entity) returns (Entity);
  rpc GetEntity(EntityId) returns (Entity);
  rpc UpdateEntity(Entity) returns (Entity);
  rpc DeleteEntity(EntityId) returns (DeleteResponse);
  rpc StreamEntities(Empty) returns (stream Entity);
}

message Entity {
  string id = 1;
  string name = 2;
  string type = 3;
  map<string, string> attributes = 4;
  string created_at = 5;
  string updated_at = 6;
}

message EntityId {
  string id = 1;
}

message DeleteResponse {
  bool success = 1;
  string message = 2;
}

message Empty {}
