events {
    worker_connections 1024;
}

http {
    # ip_hash keeps a client on one replica (socket.io long-polling fallback needs stickiness);
    # real-time events reach every replica through Redis pub/sub.
    upstream backend {
        ip_hash;
        server app:4000;
        keepalive 32;
    }

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name localhost;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        limit_req zone=api_limit burst=40 nodelay;
        limit_conn conn_limit 20;

        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 300s;
        }

        location /health {
            access_log off;
            proxy_pass http://backend/monitoring/health;
        }
    }

    # For TLS, add a `listen 443 ssl` server with ssl_certificate/ssl_certificate_key mounted into /etc/nginx/ssl.
}
